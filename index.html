<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legal App Pro - Suite Forense</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Sora:wght@700;800&display=swap");
      :root {
        --bg-start: #f8fbff;
        --bg-mid: #eef3ff;
        --bg-end: #ffeef7;
        --surface: rgba(255, 255, 255, 0.9);
        --surface-strong: #ffffff;
        --ink: #111827;
        --ink-soft: #4b5563;
        --brand: #2563eb;
        --brand-soft: #dbeafe;
        --accent: #ec4899;
        --accent-soft: #fce7f3;
      }
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.2), transparent 35%),
          radial-gradient(circle at 85% 5%, rgba(236, 72, 153, 0.16), transparent 30%),
          linear-gradient(145deg, var(--bg-start), var(--bg-mid) 50%, var(--bg-end));
        min-height: 100vh;
        -webkit-tap-highlight-color: transparent;
      }
      .app-shell {
        background: var(--surface);
        backdrop-filter: blur(14px);
      }
      .headline-serif {
        font-family: "Sora", sans-serif;
        letter-spacing: -0.02em;
      }
      .shine {
        position: relative;
        overflow: hidden;
      }
      .shine::after {
        content: "";
        position: absolute;
        inset: -120% auto auto -45%;
        width: 60%;
        height: 260%;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.45), transparent);
        transform: rotate(16deg);
        pointer-events: none;
      }
      .animate-fade-in {
        animation: fadeIn 0.35s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">
      // Piccolo helper: se qualcosa esplode, almeno lo vedi in console
      window.addEventListener("error", (e) => console.error("JS error:", e.error || e.message));

      const Icon = ({ name, size = 24, className = "" }) => {
        const [svg, setSvg] = React.useState("");

        React.useEffect(() => {
          try {
            if (!window.lucide || !window.lucide.icons) {
              setSvg("");
              return;
            }
            const iconSvg = window.lucide.icons[name];
            if (!iconSvg) {
              setSvg("");
              return;
            }

            const attrs = {
              ...iconSvg[1],
              stroke: "currentColor",
              "stroke-width": 2,
              width: size,
              height: size,
              class: className,
            };

            const children = (iconSvg[2] || [])
              .map(
                (child) =>
                  `<${child[0]} ${Object.entries(child[1] || {})
                    .map(([k, v]) => `${k}="${v}"`)
                    .join(" ")} />`
              )
              .join("");

            setSvg(
              `<svg xmlns="http://www.w3.org/2000/svg" ${Object.entries(attrs)
                .map(([k, v]) => `${k}="${v}"`)
                .join(" ")}>${children}</svg>`
            );
          } catch (err) {
            console.error("Icon render error:", err);
            setSvg("");
          }
        }, [name, size, className]);

        return <span aria-hidden="true" dangerouslySetInnerHTML={{ __html: svg }} />;
      };

      const NavButton = ({ active, onClick, iconName, label }) => (
        <button
          onClick={onClick}
          className={`flex flex-col items-center justify-center gap-1 transition-all ${
            active ? "text-blue-700 scale-105" : "text-slate-400"
          }`}
        >
          <Icon name={iconName} size={22} />
          <span className="text-[10px] font-medium uppercase tracking-wider">{label}</span>
        </button>
      );

      const TerminiProcessor = () => {
        const [startDate, setStartDate] = React.useState(new Date().toISOString().split("T")[0]);
        const [days, setDays] = React.useState(30);
        const [includeSuspension, setIncludeSuspension] = React.useState(true);
        const [resultDate, setResultDate] = React.useState(null);

        const calculate = () => {
          let date = new Date(startDate);
          let d = parseInt(days) || 0;

          date.setDate(date.getDate() + d);

          if (includeSuspension) {
            const startYear = new Date(startDate).getFullYear();
            const augStart = new Date(startYear, 7, 1);
            const augEnd = new Date(startYear, 7, 31);
            if (new Date(startDate) <= augEnd && date >= augStart) date.setDate(date.getDate() + 31);
          }

          if (date.getDay() === 6) date.setDate(date.getDate() + 2);
          else if (date.getDay() === 0) date.setDate(date.getDate() + 1);

          setResultDate(date);
        };

        React.useEffect(() => {
          calculate();
        }, [startDate, days, includeSuspension]);

        return (
          <div className="p-5 animate-fade-in">
            <div className="bg-white/95 rounded-3xl shadow-lg border border-white p-6 space-y-4">
              <label className="block text-sm font-bold text-slate-700">Data Inizio</label>
              <input
                type="date"
                value={startDate}
                onChange={(e) => setStartDate(e.target.value)}
                className="w-full p-3 border border-slate-200 rounded-xl bg-slate-50"
              />

              <label className="block text-sm font-bold text-slate-700">Giorni</label>
              <input
                type="number"
                value={days}
                onChange={(e) => setDays(e.target.value)}
                className="w-full p-3 border border-slate-200 rounded-xl bg-slate-50"
              />

              <div className="flex items-center gap-2 p-3 bg-blue-50 rounded-xl text-blue-800 text-sm font-medium">
                <input
                  type="checkbox"
                  checked={includeSuspension}
                  onChange={(e) => setIncludeSuspension(e.target.checked)}
                  className="w-5 h-5 accent-blue-600"
                />
                Sospensione Feriale (Ago)
              </div>

              {resultDate && (
                <div className="mt-6 p-6 bg-gradient-to-br from-slate-900 to-slate-700 text-white rounded-2xl text-center">
                  <div className="text-xs uppercase font-bold text-slate-300">Scadenza</div>
                  <div className="text-2xl font-black mt-1">
                    {resultDate.toLocaleDateString("it-IT", { day: "2-digit", month: "long", year: "numeric" })}
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      };

      const CalcoloInteressi = () => {
        const today = new Date().toISOString().split("T")[0];
        const defaultStart = new Date(Date.now() - 1000 * 60 * 60 * 24 * 90).toISOString().split("T")[0];

        const [capital, setCapital] = React.useState(10000);
        const [rate, setRate] = React.useState(5);
        const [startDate, setStartDate] = React.useState(defaultStart);
        const [endDate, setEndDate] = React.useState(today);
        const [method, setMethod] = React.useState("simple");
        const [yearBase, setYearBase] = React.useState(365);
        const [compounding, setCompounding] = React.useState(12);
        const [includeSpread, setIncludeSpread] = React.useState(false);
        const [spread, setSpread] = React.useState(2);

        const format = (v) => new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" }).format(v);

        const results = React.useMemo(() => {
          const start = new Date(startDate);
          const end = new Date(endDate);
          const msPerDay = 1000 * 60 * 60 * 24;
          const diffMs = end.getTime() - start.getTime();
          const days = diffMs > 0 ? Math.floor(diffMs / msPerDay) : 0;
          const effectiveRate = (parseFloat(rate) || 0) + (includeSpread ? parseFloat(spread) || 0 : 0);
          const principal = parseFloat(capital) || 0;
          const annualRate = effectiveRate / 100;

          if (!principal || !days || !annualRate) {
            return {
              days,
              effectiveRate,
              interest: 0,
              amount: principal,
            };
          }

          if (method === "compound") {
            const n = parseInt(compounding) || 1;
            const exponent = (n * days) / yearBase;
            const amount = principal * Math.pow(1 + annualRate / n, exponent);
            return {
              days,
              effectiveRate,
              interest: Math.max(0, amount - principal),
              amount,
            };
          }

          const interest = principal * annualRate * (days / yearBase);
          return {
            days,
            effectiveRate,
            interest,
            amount: principal + interest,
          };
        }, [capital, rate, startDate, endDate, method, yearBase, compounding, includeSpread, spread]);

        return (
          <div className="p-5 animate-fade-in space-y-4">
            <div className="shine rounded-3xl border border-fuchsia-100 bg-gradient-to-r from-blue-50 via-violet-50 to-pink-50 p-5">
              <div className="text-xs uppercase tracking-[0.2em] text-slate-500 font-semibold">Calcolo Interessi</div>
              <div className="headline-serif mt-1 text-2xl text-slate-900">Stima finanziaria dettagliata</div>
              <p className="mt-2 text-sm text-slate-600">Configura periodo, tasso e metodo di capitalizzazione per ottenere un conteggio chiaro e difendibile.</p>
            </div>

            <div className="bg-white/95 rounded-3xl shadow-lg border border-white p-6 space-y-4">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-1">Capitale</label>
                  <input
                    type="number"
                    value={capital}
                    onChange={(e) => setCapital(parseFloat(e.target.value) || 0)}
                    className="w-full p-3 border border-slate-200 rounded-xl bg-slate-50"
                  />
                </div>
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-1">Tasso Annuo (%)</label>
                  <input
                    type="number"
                    step="0.01"
                    value={rate}
                    onChange={(e) => setRate(parseFloat(e.target.value) || 0)}
                    className="w-full p-3 border border-slate-200 rounded-xl bg-slate-50"
                  />
                </div>
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-1">Data Inizio</label>
                  <input
                    type="date"
                    value={startDate}
                    onChange={(e) => setStartDate(e.target.value)}
                    className="w-full p-3 border border-slate-200 rounded-xl bg-slate-50"
                  />
                </div>
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-1">Data Fine</label>
                  <input
                    type="date"
                    value={endDate}
                    onChange={(e) => setEndDate(e.target.value)}
                    className="w-full p-3 border border-slate-200 rounded-xl bg-slate-50"
                  />
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                <button
                  onClick={() => setMethod("simple")}
                  className={`rounded-xl p-3 text-sm font-semibold transition ${
                    method === "simple" ? "bg-gradient-to-r from-blue-600 to-indigo-500 text-white shadow" : "bg-slate-100 text-slate-700"
                  }`}
                >
                  Interesse Semplice
                </button>
                <button
                  onClick={() => setMethod("compound")}
                  className={`rounded-xl p-3 text-sm font-semibold transition ${
                    method === "compound" ? "bg-gradient-to-r from-blue-600 to-indigo-500 text-white shadow" : "bg-slate-100 text-slate-700"
                  }`}
                >
                  Interesse Composto
                </button>
                <select
                  value={yearBase}
                  onChange={(e) => setYearBase(parseInt(e.target.value) || 365)}
                  className="rounded-xl p-3 bg-slate-100 text-sm font-semibold text-slate-700"
                >
                  <option value={365}>Base 365 giorni</option>
                  <option value={360}>Base 360 giorni</option>
                </select>
              </div>

              {method === "compound" && (
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-1">Frequenza Capitalizzazione</label>
                  <select
                    value={compounding}
                    onChange={(e) => setCompounding(parseInt(e.target.value) || 1)}
                    className="w-full p-3 border border-slate-200 rounded-xl bg-slate-50"
                  >
                    <option value={1}>Annuale</option>
                    <option value={2}>Semestrale</option>
                    <option value={4}>Trimestrale</option>
                    <option value={12}>Mensile</option>
                  </select>
                </div>
              )}

              <div className="rounded-2xl bg-slate-50 border border-slate-200 p-4">
                <label className="flex items-center gap-3 text-sm font-semibold text-slate-700">
                  <input
                    type="checkbox"
                    checked={includeSpread}
                    onChange={(e) => setIncludeSpread(e.target.checked)}
                    className="w-5 h-5 accent-blue-600"
                  />
                  Applica spread/mora aggiuntivo
                </label>
                {includeSpread && (
                  <div className="mt-3">
                    <label className="block text-xs uppercase tracking-wider text-slate-500 mb-1">Spread (%)</label>
                    <input
                      type="number"
                      step="0.01"
                      value={spread}
                      onChange={(e) => setSpread(parseFloat(e.target.value) || 0)}
                      className="w-full p-3 border border-slate-200 rounded-xl bg-white"
                    />
                  </div>
                )}
              </div>
            </div>

            <div className="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-900 text-white rounded-3xl p-6 shadow-lg">
              <div className="text-xs uppercase tracking-[0.2em] text-slate-400 font-semibold">Riepilogo</div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                <div className="rounded-xl bg-white/5 p-4">
                  <div className="text-xs text-slate-400 uppercase">Giorni calcolati</div>
                  <div className="text-2xl font-bold mt-1">{results.days}</div>
                </div>
                <div className="rounded-xl bg-white/5 p-4">
                  <div className="text-xs text-slate-400 uppercase">Tasso effettivo annuo</div>
                  <div className="text-2xl font-bold mt-1">{results.effectiveRate.toFixed(2)}%</div>
                </div>
                <div className="rounded-xl bg-white/5 p-4">
                  <div className="text-xs text-slate-400 uppercase">Interessi maturati</div>
                  <div className="text-2xl font-bold mt-1">{format(results.interest)}</div>
                </div>
              </div>
              <div className="mt-4 rounded-2xl bg-gradient-to-r from-blue-600 to-fuchsia-500 p-4 text-center">
                <div className="text-xs uppercase font-semibold text-blue-50">Montante Totale</div>
                <div className="text-3xl font-extrabold mt-1">{format(results.amount)}</div>
              </div>
            </div>
          </div>
        );
      };

      const FatturazioneAvvocato = () => {
        const [taxable, setTaxable] = React.useState(1000);
        const [applyRitenuta, setApplyRitenuta] = React.useState(true);

        const cpa = taxable * 0.04;
        const iva = (taxable + cpa) * 0.22;
        const ritenuta = applyRitenuta ? taxable * 0.2 : 0;
        const totale = taxable + cpa + iva - ritenuta;

        const format = (v) => new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" }).format(v);

        return (
          <div className="p-5 animate-fade-in">
            <div className="bg-white/95 rounded-3xl shadow-lg border border-white p-6 space-y-4">
              <label className="block text-sm font-bold text-slate-700">Onorario Imponibile</label>
              <input
                type="number"
                value={taxable}
                onChange={(e) => setTaxable(parseFloat(e.target.value) || 0)}
                className="w-full p-3 border border-slate-200 rounded-xl bg-slate-50 font-bold"
              />

              <div className="flex justify-between items-center p-3 bg-slate-50 rounded-xl">
                <span className="text-sm font-medium">Ritenuta d'Acconto 20%</span>
                <input
                  type="checkbox"
                  checked={applyRitenuta}
                  onChange={(e) => setApplyRitenuta(e.target.checked)}
                  className="w-6 h-6 accent-green-600"
                />
              </div>

              <div className="space-y-2 border-t pt-4">
                <div className="flex justify-between text-sm text-slate-500">
                  <span>CPA (4%)</span>
                  <span>{format(cpa)}</span>
                </div>
                <div className="flex justify-between text-sm text-slate-500">
                  <span>IVA (22%)</span>
                  <span>{format(iva)}</span>
                </div>
                {applyRitenuta && (
                  <div className="flex justify-between text-sm text-red-500">
                    <span>Ritenuta</span>
                    <span>-{format(ritenuta)}</span>
                  </div>
                )}

                <div className="mt-4 p-4 bg-gradient-to-r from-emerald-600 to-emerald-500 text-white rounded-xl text-center">
                  <div className="text-xs font-bold uppercase">Netto a Pagare</div>
                  <div className="text-3xl font-black">{format(totale)}</div>
                </div>
              </div>
            </div>
          </div>
        );
      };

      const Dashboard = ({ onSelect }) => {
        const apps = [
          { id: "istat", title: "Rivalutazioni Istat", icon: "Calculator", color: "from-cyan-200 to-blue-200" },
          { id: "interessi", title: "Tassi e Interessi", icon: "TrendingUp", color: "from-indigo-200 to-violet-200" },
          { id: "termini", title: "Scadenze e Termini", icon: "Calendar", color: "from-amber-100 to-orange-200" },
          { id: "atti", title: "Atti Giudiziari", icon: "Scale", color: "from-slate-200 to-zinc-300" },
          { id: "fattura", title: "Fatturazione Avvocati", icon: "Euro", color: "from-emerald-200 to-teal-200" },
          { id: "danni", title: "Risarcimento Danni", icon: "Briefcase", color: "from-pink-200 to-rose-200" },
        ];

        return (
          <div className="p-5 grid grid-cols-2 md:grid-cols-3 gap-4 animate-fade-in">
            {apps.map((app) => (
              <button
                key={app.id}
                onClick={() => onSelect(app.id)}
                className={`shine bg-gradient-to-br ${app.color} aspect-square rounded-3xl p-4 flex flex-col items-center justify-center text-center shadow-md hover:shadow-xl hover:-translate-y-0.5 active:scale-95 transition-transform border border-white/80`}
              >
                <Icon name={app.icon} size={32} className="mb-2 opacity-80" />
                <span className="text-xs font-bold leading-tight">{app.title}</span>
              </button>
            ))}
          </div>
        );
      };

      const App = () => {
        const [view, setView] = React.useState("home");
        const [currentApp, setCurrentApp] = React.useState(null);

        const renderBody = () => {
          if (currentApp === "termini") return <TerminiProcessor />;
          if (currentApp === "interessi") return <CalcoloInteressi />;
          if (currentApp === "fattura") return <FatturazioneAvvocato />;
          if (currentApp) return <div className="p-10 text-center text-slate-400 italic">Modulo {currentApp} in fase di sviluppo.</div>;

          if (view === "home") return <Dashboard onSelect={setCurrentApp} />;
          return <div className="p-10 text-center text-slate-400 italic">Sezione {view} non ancora disponibile.</div>;
        };

        return (
          <div className="min-h-screen px-3 py-3 md:px-6 md:py-6">
            <div className="app-shell relative max-w-5xl mx-auto border border-white/90 rounded-[2rem] shadow-2xl overflow-hidden flex flex-col h-[calc(100vh-1.5rem)] md:h-[calc(100vh-3rem)]">
            <header className="bg-white/90 border-b border-slate-200 px-5 py-4 flex items-center justify-between sticky top-0 z-10">
              <div className="flex items-center gap-2">
                {currentApp && (
                  <button onClick={() => setCurrentApp(null)} className="p-1 hover:bg-slate-100 rounded-full">
                    <Icon name="ChevronLeft" />
                  </button>
                )}
                <div>
                  <div className="text-[11px] uppercase tracking-[0.18em] text-fuchsia-600 font-semibold">Lawsuite</div>
                  <h1 className="font-bold text-lg leading-tight">{currentApp ? "Utility Professionale" : "Legal App Pro"}</h1>
                </div>
              </div>
              <div className="w-9 h-9 bg-gradient-to-br from-blue-600 via-indigo-500 to-fuchsia-500 rounded-xl flex items-center justify-center text-white text-[10px] font-bold shadow">AV</div>
            </header>

            <main className="flex-1 overflow-y-auto pb-20">{renderBody()}</main>

            <nav className="bg-white/95 border-t border-slate-200 h-16 flex items-center justify-around absolute bottom-0 w-full">
              <NavButton
                active={view === "home" && !currentApp}
                onClick={() => {
                  setView("home");
                  setCurrentApp(null);
                }}
                iconName="Home"
                label="Home"
              />
              <NavButton active={view === "history"} onClick={() => setView("history")} iconName="History" label="Storia" />
              <NavButton active={view === "settings"} onClick={() => setView("settings")} iconName="Settings" label="Impostazioni" />
            </nav>
            </div>
          </div>
        );
      };

      const rootEl = document.getElementById("root");
      const root = ReactDOM.createRoot(rootEl);
      root.render(<App />);
    </script>
  </body>
</html>
